[package]
name = "chista"
version = "0.1.0"
description = "Local-first safe debug sessions"
authors = ["Chista"]
edition = "2021"
[lib]
name = "chista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
